
services:
  hydro_regressor:
    build:
      context: .
      dockerfile: hydro_model/docker/Dockerfile
    ports:
      - "${API_PORT}:${CONTAINER_API_PORT}"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${CONTAINER_POSTGRES_PORT}
    volumes:
      - ./hydro_model/app:/app/app
      - ./saved_models:/app/saved_models
      - ./data:/app/data
    depends_on:
      - postgres
  postgres:
    #restart: unless-stopped
    build:
      context: .
      dockerfile: postgres/docker/Dockerfile
    ports:
      - "${POSTGRES_PORT}:${CONTAINER_POSTGRES_PORT}"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:${CONTAINER_ADMINER_PORT}

volumes:
  postgres_data: